site_name: "Дополнительные главы школьной математики"
site_description: "Углублённое изучение математики за рамками стандартной школьной программы. Алгебра, геометрия, комбинаторика, теория чисел, логика и доказательства."
site_author: "Расул Османов"
repo_url: "https://github.com/lscode-me/math"
repo_name: "lscode-me/math"
site_url: "https://math.lscode.me/"

# SEO и Open Graph
extra:
  analytics:
    provider: google
    property: G-099B0CWG6V
  social:

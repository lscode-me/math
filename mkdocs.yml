site_name: "Дополнительные главы школьной математики"
site_description: "Углублённое изучение математики за рамками стандартной школьной программы. Алгебра, геометрия, комбинаторика, теория чисел, логика и доказательства."
site_author: "Расул Османов"
repo_url: "https://github.com/lscode-me/math"
repo_name: "lscode-me/math"
site_url: "https://math.lscode.me/"

# SEO и Open Graph
extra:
  analytics:
    provider: google
    property: G-099B0CWG6V
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lscode-me/math
      name: GitHub репозиторий
    - icon: fontawesome/solid/envelope
      link: mailto:admin@lscode.me
      name: Email автора
  # Open Graph для социальных сетей
  meta:
    - name: keywords
      content: математика, школьная математика, алгебра, геометрия, комбинаторика, теория чисел, олимпиадная математика, дополнительные главы, доказательства, задачи
    - name: author
      content: Расул Османов
    - property: og:type
      content: website
    - property: og:locale
      content: ru_RU
    - property: og:site_name
      content: "Дополнительные главы школьной математики"
    - name: twitter:card
      content: summary_large_image
copyright: "© 2026 Расул Османов. Лицензия CC BY-SA 4.0"

nav:
  - Главная: index.md
  - О проекте: about.md
  - Что нового: changelog.md
  - О книге: chapters/intro/preface.md
  - "Часть I. Числа, цифры и арифметика":
      - "1.1. Цифры vs числа": chapters/numbers/digits-vs-numbers.md
      - "1.2. Таблицы наизусть": chapters/numbers/tables.md
      - "1.3. Делимость и простые числа": chapters/numbers/divisibility.md
      - "1.4. Разрешённые и запрещённые операции": chapters/numbers/operations.md
      - "1.5. Виды чисел": chapters/numbers/number-types.md
      - "1.6. Бесконечность и парадоксы": chapters/numbers/infinity.md
      - "1.7. Тетрация": chapters/numbers/tetration.md
      - "1.8. Числа с плавающей точкой": chapters/numbers/floating-point.md
      - "1.9. Комплексные числа": chapters/numbers/complex.md
  - "Часть II. Уравнения и неравенства":
      - "2.1. Уравнения и равносильные преобразования": chapters/algebra/equations.md
      - "2.2. Квадратные уравнения": chapters/algebra/quadratic.md
      - "2.3. Кубические уравнения": chapters/algebra/cubic.md
      - "2.4. Системы уравнений": chapters/algebra/systems.md
  - "Часть III. Тригонометрия":
      - "3.1. Точные значения синусов и косинусов": chapters/trigonometry/trig-values.md
  - "Часть IV. Комбинаторика":
      - "4.1. Комбинаторика": chapters/combinatorics/combinatorics.md
  - "Часть V. Статистика и данные":
      - "5.1. Статистика и закономерности данных": chapters/statistics/statistics.md
  - "Часть VI. Алгоритмы и сложность":
      - "6.1. Алгоритмическая сложность": chapters/algorithms/complexity.md
      - "6.2. Структуры данных и алгоритмические задачи": chapters/algorithms/data-structures.md
      - "6.3. Вероятностные структуры данных": chapters/algorithms/probabilistic.md

theme:
  name: material
  custom_dir: overrides
  language: ru
  favicon: assets/images/favicon.ico
  icon:
    logo: material/math-integral-box
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang: ru
  - meta

extra_css:
  - assets/styles.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js
  - assets/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
